<article
  class="task"
  [class.task--completed]="task().completed"
  (click)="edit.emit(task())"
  (keydown.enter)="edit.emit(task())"
  tabindex="0"
>
  <button
    class="check"
    type="button"
    [attr.aria-label]="task().completed ? 'Mark ' + task().title + ' as incomplete' : 'Mark ' + task().title + ' as complete'"
    (click)="$event.stopPropagation(); toggle.emit(task().id)"
  >
    @if (task().completed) {
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m6.5 12.5 3.5 3.5 7.5-8" />
      </svg>
    }
  </button>

  <div class="task__content">
    <span class="task__title">{{ task().title }}</span>
    <span class="task__priority" [class]="'task__priority task__priority--' + task().priority">
      {{ task().priority }}
    </span>
  </div>

  <button
    class="delete"
    type="button"
    [attr.aria-label]="'Delete ' + task().title"
    (click)="$event.stopPropagation(); remove.emit(task().id)"
  >
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5" />
    </svg>
  </button>
</article>
